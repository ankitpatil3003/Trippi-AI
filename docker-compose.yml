services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: trippi
      POSTGRES_PASSWORD: trippi
      POSTGRES_DB: trippi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/trippipass
    ports:
      - "7474:7474"
      - "7687:7687"

  api:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      MCP_STUB: "true"
      MCP_SERVER_URL: http://host.docker.internal:8000/mcp
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173
      DATABASE_URL: postgresql://trippi:trippi@postgres:5432/trippi
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: trippipass
    depends_on:
      - postgres
      - neo4j

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8080
    depends_on:
      - api

volumes:
  pgdata:
