services:
  - type: web
    name: trippi-ai-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: MCP_SERVER_URL
        sync: false
      - key: MCP_STUB
        value: "false"
      - key: OPENAI_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: openai
      - key: DATE_SHIFT_RAIN_RATIO
        value: "0.6"
      - key: CORS_ORIGINS
        sync: false
